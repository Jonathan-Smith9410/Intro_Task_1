server {
    listen 80;

    # 10.96.0.10 is the standard ClusterIP for kube-dns in almost all K8s clusters
    resolver 10.96.0.10 valid=5s;

    location / {
        set $target http://webapp.default.svc.cluster.local:5000;
        proxy_pass $target;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}